[project]
name = "mcp-icloud-caldav"
version = "0.2.0"
description = "MCP server for iCloud Calendar over CalDAV: list, create, update, move and delete events"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Glob0x17" }]
keywords = ["mcp", "model-context-protocol", "icloud", "caldav", "calendar"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = ["loguru>=0.7.3", "mcp>=2.3", "caldav>=3.4", "vobject>=0.9.6", "python-dateutil>=2.9"]

[project.urls]
Homepage = "https://github.com/Glob0x17/mcp-icloud-caldav"
Repository = "https://github.com/Glob0x17/mcp-icloud-caldav"
Issues = "https://github.com/Glob0x17/mcp-icloud-caldav/issues"

[project.scripts]
mcp-icloud-caldav = "mcp_icloud_caldav.server:main"

[dependency-groups]
dev = ["pytest>=8.3.4", "pytest-mock>=3.14.0", "pytest-random-order>=1.1.1", "ruff>=0.6"]


[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true


[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_icloud_caldav"]

[tool.hatch.build.targets.sdist]
include = ["mcp_icloud_caldav", "tests", "README.md", "LICENSE", "config.json.example"]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs real iCloud credentials (ICLOUD_USERNAME/ICLOUD_PASSWORD)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
ignore = [
    # MCP tool handlers turn any failure into an error string for the client instead of crashing
    # the stdio server, and event parsing skips unreadable items: broad catches are deliberate.
    "BLE001",
    "S110",
    # Configuration errors are reported as ValueError, which the server layer catches.
    "TRY004",
]
